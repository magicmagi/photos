<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photography Portfolio</title>
  <meta name="description" content="Maggie T 的摄影作品集：建筑、自然、人文、云端、卡萨布兰卡黑白">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Photography Portfolio">
  <meta property="og:description" content="Maggie T 的摄影作品集：建筑、自然、人文、云端、卡萨布兰卡黑白">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=38f90ddb">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow" id="site-name"></p>
      <h1 id="site-title"></h1>
      <p class="tagline" id="site-tagline"></p>
      <nav class="links" id="site-links"></nav>
    </div>
  </header>

  <div class="toolbar" id="toolbar">
    <div class="chips" id="chips" role="tablist"></div>
    <div class="controls">
      <button class="ctl" id="sort-btn" title="切换排序"></button>
      <button class="ctl" id="view-btn" title="切换视图"></button>
    </div>
  </div>

  <main id="gallery" class="gallery"></main>

  <section class="about" id="about">
    <h2>关于 · About</h2>
    <p id="site-about"></p>
  </section>

  <footer class="foot">
    <span id="foot-name"></span> · <span id="foot-count"></span>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" id="lb-close" aria-label="关闭">×</button>
    <button class="lb-nav lb-prev" id="lb-prev" aria-label="上一张">‹</button>
    <button class="lb-nav lb-next" id="lb-next" aria-label="下一张">›</button>
    <figure class="lb-stage">
      <img id="lb-img" alt="">
    </figure>
    <aside class="lb-info" id="lb-info"></aside>
  </div>

  <div class="toast" id="toast"></div>

  <script src="config.js?v=dd85939d"></script>
  <script src="photos.js?v=be332345"></script>
  <script src="app.js?v=1b28e08a"></script>
</body>
</html>
